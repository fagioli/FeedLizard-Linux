name: Flatpak validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "data/**"
      - "flatpak/**"
      - ".github/workflows/flatpak.yml"

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.arch }} manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Validate Flatpak build
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.5
        with:
          manifest-path: flatpak/io.github.feedlizard.FeedLizard.yml
          build-bundle: false
          arch: ${{ matrix.arch }}
          branch: release
          cache-key: feedlizard-flatpak-${{ matrix.arch }}-${{ github.sha }}
          verbose: true
