name: Publish signed Flatpak repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated beta release tag (for example v0.9.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-repository:
    name: ${{ matrix.arch }} signed repository
    environment: production-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
      - name: Validate tag and import protected signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          GITHUB_REF_NAME: ${{ inputs.tag }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_KEY_ID"
          scripts/release-version.sh
          install -d -m 700 "$HOME/.gnupg"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$GPG_KEY_ID"
      - name: Build signed repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.5
        with:
          manifest-path: flatpak/io.github.feedlizard.FeedLizard.yml
          build-bundle: false
          upload-artifact: false
          repo-dir: repository-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          branch: release
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          cache-key: feedlizard-signed-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'flatpak/io.github.feedlizard.FeedLizard.yml', 'flatpak/cargo-sources.json') }}
      - name: Package repository shard
        run: tar -C repository-${{ matrix.arch }} -czf repository-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-${{ matrix.arch }}
          path: repository-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  pages-artifact:
    needs: signed-repository
    runs-on: ubuntu-24.04
    environment: production-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: repository-*
          path: shards
      - name: Merge architecture repositories and sign summary
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_PUBLIC_KEY: ${{ secrets.FLATPAK_GPG_PUBLIC_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          install -d -m 700 "$HOME/.gnupg"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PUBLIC_KEY" > feedlizard-public-key.asc
          gpg --batch --dearmor < feedlizard-public-key.asc > feedlizard-public-key.gpg
          install -d site/repo
          ostree --repo=site/repo init --mode=archive-z2
          if curl -fsI "https://fagioli.github.io/FeedLizard-Linux/repo/summary" >/dev/null; then
            ostree --repo=site/repo remote add \
              --gpg-import=feedlizard-public-key.gpg \
              previous \
              "https://fagioli.github.io/FeedLizard-Linux/repo/"
            ostree --repo=site/repo pull --mirror previous
          fi
          for archive in shards/*/*.tar.gz; do
            shard="$(mktemp -d)"
            tar -C "$shard" -xzf "$archive"
            while IFS= read -r ref; do
              ostree --repo=site/repo pull-local "$shard" "$ref"
            done < <(ostree --repo="$shard" refs)
          done
          flatpak build-update-repo \
            --title="FeedLizard" \
            --comment="Official FeedLizard Linux Flatpak repository" \
            --homepage="https://github.com/fagioli/FeedLizard-Linux" \
            --default-branch=release \
            --generate-static-deltas \
            --gpg-sign="$GPG_KEY_ID" \
            site/repo
          cp feedlizard-public-key.asc site/feedlizard-public-key.asc
          cp feedlizard-public-key.gpg site/feedlizard-public-key.gpg
          scripts/make-flatpakref.sh \
            "https://fagioli.github.io/FeedLizard-Linux/repo/" \
            site/feedlizard-public-key.gpg \
            site/FeedLizard.flatpakref
          size="$(du -sb site | cut -f1)"
          test "$size" -lt 943718400
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: pages-artifact
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
