[package]
name = "feedlizard-refresh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false

[dependencies]
feedlizard-core = { path = "../feedlizard-core" }
feedlizard-network = { path = "../feedlizard-network" }
feedlizard-storage = { path = "../feedlizard-storage" }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
