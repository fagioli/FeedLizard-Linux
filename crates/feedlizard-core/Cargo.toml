[package]
name = "feedlizard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2.5"
