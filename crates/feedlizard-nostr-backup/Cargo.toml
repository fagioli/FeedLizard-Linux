[package]
name = "feedlizard-nostr-backup"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MPL-2.0"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.2"
feedlizard-core = { path = "../feedlizard-core" }
futures = "0.3.31"
nostr-sdk = { version = "0.45.2", default-features = false, features = ["rustls-tls-webpki-roots"] }
nostr = { version = "0.45.3", features = ["nip44", "os-rng"] }
oo7 = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt", "time"] }

[dev-dependencies]
feedlizard-storage = { path = "../feedlizard-storage" }
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
