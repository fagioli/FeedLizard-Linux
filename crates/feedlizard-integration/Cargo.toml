[package]
name = "feedlizard-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MPL-2.0"
publish = false

[dependencies]
feedlizard-storage = { path = "../feedlizard-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
feedlizard-core = { path = "../feedlizard-core" }
tempfile = "3"
